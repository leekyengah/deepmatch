name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Secrets guard
        run: |
          if git grep -nE 'SUPABASE_SERVICE_ROLE_KEY=ey|BEGIN RSA PRIVATE KEY|sk_live_' -- ':!.github/**' ; then
            echo "Potential secret detected"; exit 1;
          fi
          echo "Secrets guard OK"
      - name: Lint / typecheck / unit / build
        run: npm run ci
        env:
          NEXT_PUBLIC_APP_ENV: ci
          FF_MATCHING: "true"
          FF_CHAT: "true"
          FF_MEDIA_UPLOAD: "true"
          FF_CONCIERGE: "false"
          FF_DISCOVERY: "true"
