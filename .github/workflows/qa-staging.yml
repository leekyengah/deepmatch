# Staging QA — manual / post-deploy only. Never runs against production writes.
# Secrets: optional QA_EMAIL_*, QA_PASSWORD, NEXT_PUBLIC_SUPABASE_*, SUPABASE_SERVICE_ROLE_KEY (staging only).
name: QA Staging

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite filter (p0|w2|staging-accept|all)"
        required: true
        default: "p0"
      base_url:
        description: "Allowlisted staging base URL"
        required: true
        default: "https://datingvn.com"
      write_sheet:
        description: "Narrow Sheet53 write (QA columns only). Requires QA_SHEETS_WRITE secret=1"
        type: boolean
        default: false

concurrency:
  group: qa-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-qa:
    name: Staging suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      QA_EMAIL_A: ${{ secrets.QA_EMAIL_A }}
      QA_EMAIL_B: ${{ secrets.QA_EMAIL_B }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_PAIR_ID: ${{ secrets.QA_PAIR_ID }}
      QA_CONVERSATION_ID: ${{ secrets.QA_CONVERSATION_ID }}
      QA_MATCH_ID: ${{ secrets.QA_MATCH_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QA_SHEETS_WRITE: ${{ inputs.write_sheet && secrets.QA_SHEETS_WRITE || '' }}
      SERVICES_PAYMENT_LIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Refuse non-allowlisted host
        run: |
          host=$(node -e "console.log(new URL(process.env.E2E_BASE_URL).hostname)")
          case "$host" in
            datingvn.com|www.datingvn.com|localhost|127.0.0.1) echo "allowlist OK: $host" ;;
            *) echo "Host $host not allowlisted"; exit 1 ;;
          esac
      - name: Run DeepMatch QA suite
        run: npx tsx packages/deepmatch-qa/src/cli.ts --suite "${{ inputs.suite }}" --env dm-staging
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent-staging-${{ github.sha }}
          path: docs/evidence/qa-agent/
          retention-days: 14
